<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13212a">
<title>Ticket to Ride · Παίκτης</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:wght@600;700&family=IM+Fell+English+SC&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/board.css">
<style>
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  #app { height: 100%; display: flex; flex-direction: column; }

  /* header */
  #top {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top));
    background: var(--bg-2); border-bottom: 1px solid var(--line); flex: none;
  }
  #top .me { display: flex; align-items: center; gap: 8px; font-weight: 700; min-width: 0; flex: 1; }
  #top .me span.name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat { display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: 14px; white-space: nowrap; }
  .stat svg { width: 18px; height: 18px; opacity: 0.8; }
  #tickets-btn { min-height: 36px; padding: 6px 10px; font-size: 13px; }

  #status {
    padding: 8px 12px; font-weight: 700; font-size: 14px; text-align: center; flex: none;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  #status.myturn { background: linear-gradient(90deg, #3d5a1f, #5b7d27); color: #f4ffe0; }
  #status .last { color: #ffcf6e; margin-left: 6px; }

  /* board */
  #board-wrap { position: relative; flex: 1; min-height: 120px; background: #0e1920; }
  #board { position: absolute; inset: 0; }
  #zoom { position: absolute; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
  #zoom button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: rgba(20, 35, 43, 0.9); font-size: 22px; font-weight: 700; }

  /* market + hand */
  .tray { flex: none; padding: 10px 10px 8px; background: var(--bg-2); border-top: 1px solid var(--line); }
  .tray-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .row { display: flex; gap: 8px; align-items: center; overflow-x: auto; padding: 8px 4px 4px; scrollbar-width: none; }
  .row::-webkit-scrollbar { display: none; }
  #market .row { gap: 5px; padding-left: 2px; padding-right: 2px; }
  #market .tcard { cursor: pointer; width: 40px; height: 58px; }
  #market .tix-back { width: 50px; }
  #market .tcard.disabled { opacity: 0.35; cursor: not-allowed; }
  #market .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }
  .deckbtn { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: var(--muted); font-weight: 700; cursor: pointer; flex: none; max-width: 56px; white-space: nowrap; }
  .deckbtn .tcard { width: 46px; }
  .tix-back { width: 58px; height: 40px; border-radius: 6px; background: #dce8f5; border: 2px solid #5b86b5; display: flex; align-items: center; justify-content: center; color: #2c5a8c; font-weight: 800; }
  #hand { padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  #hand .row { padding-top: 10px; min-height: 84px; }
  .hand-empty { color: var(--muted); font-size: 13px; padding: 20px 4px; }

  @media (orientation: landscape) and (max-height: 520px) {
    #app { display: grid; grid-template-columns: 1fr 250px; grid-template-rows: auto auto 1fr auto; }
    #top, #status { grid-column: 1 / 3; }
    #board-wrap { grid-column: 1; grid-row: 3 / 5; }
    #market { grid-column: 2; grid-row: 3; border-left: 1px solid var(--line); overflow: auto; }
    #hand { grid-column: 2; grid-row: 4; border-left: 1px solid var(--line); }
    .row { flex-wrap: wrap; overflow: visible; }
    .tcard { width: 38px; height: 54px; }
  }

  /* sheets */
  .pay-list { display: flex; flex-direction: column; gap: 8px; }
  .pay-opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
  .pay-opt:active { background: var(--panel-2); }
  .pay-chips { display: flex; gap: 12px; padding: 6px 4px 2px; }
  .pay-opt .tcard { width: 34px; height: 48px; }
  .overlay.light { background: rgba(5, 12, 16, 0.2); }
  .pay-opt .go { font-weight: 800; color: var(--gold-2); }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px; }
  .badge { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 20px; background: var(--panel-2); border: 1px solid var(--line); }
  .badge.tunnel { background: #3a2c22; border-color: #6d5238; }
  .badge.ferry { background: #1f3b4f; border-color: #36627f; }
  .swatch { display: inline-block; width: 22px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,.5); vertical-align: middle; margin-right: 6px; }
  .note { padding: 10px 12px; border-radius: 10px; background: var(--panel); color: var(--muted); font-weight: 600; }
  .note.warn { color: #ffcf9e; }
  .city-routes { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
  .city-route { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; }
  .city-route .to { flex: 1; font-weight: 700; }
  .city-route .len { font-size: 13px; color: var(--muted); }
  .tix-list { display: flex; flex-direction: column; gap: 8px; }
  .tix-list .ticket { cursor: pointer; }
  .tix-list .ticket.sel { outline: 3px solid var(--gold); outline-offset: 2px; }
  .tix-list .ticket.unsel { opacity: 0.55; }
  .revealed { display: flex; gap: 12px; justify-content: center; margin: 10px 0 14px; }
  .revealed .tcard { width: 60px; height: 86px; }
  .revealed .tcard.hit { box-shadow: 0 0 0 3px #ff6b5b, 0 0 18px rgba(255, 107, 91, 0.7); }

  /* lobby + results */
  .screen { flex: 1; overflow: auto; padding: 20px 16px; }
  .screen h1 { font-size: 30px; color: var(--gold-2); margin-bottom: 6px; }
  .members { display: flex; flex-direction: column; gap: 8px; margin: 16px 0; }
  .member { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--panel); border-radius: 12px; border: 1px solid var(--line); font-weight: 700; }
  .member .on { margin-left: auto; font-size: 12px; color: var(--muted); }
  .member .on.yes { color: var(--ok); }
  .results { width: 100%; border-collapse: collapse; margin-top: 12px; }
  .results th, .results td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; }
  .results th:nth-child(2), .results td:nth-child(2) { text-align: left; }
  .results th { font-size: 12px; color: var(--muted); }
  .results tr.win td { color: var(--gold-2); font-weight: 800; }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="me"><span id="me-dot" class="pdot"></span><span id="me-name" class="name"></span></div>
    <div class="stat" title="Πόντοι"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z"/></svg><span id="me-score">0</span></div>
    <div class="stat" title="Βαγόνια"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 6h18v10H3zM5 8v4h4V8zm6 0v4h4V8zm6 0v4h2V8zM7 20a2 2 0 110-4 2 2 0 010 4zm10 0a2 2 0 110-4 2 2 0 010 4z"/></svg><span id="me-trains">45</span></div>
    <div class="stat" title="Σταθμοί"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 11l9-8 9 8v10H3zm7 3v7h4v-7z"/></svg><span id="me-stations">3</span></div>
    <button id="tickets-btn" class="btn small">Προορισμοί <span id="me-tix">0</span></button>
  </header>
  <div id="status">Σύνδεση…</div>

  <div id="lobby" class="screen hidden"></div>

  <div id="board-wrap" class="hidden">
    <div id="board"></div>
    <div id="zoom"><button id="zin" aria-label="Μεγέθυνση">+</button><button id="zout" aria-label="Σμίκρυνση">−</button><button id="zfit" aria-label="Όλος ο χάρτης" style="font-size:14px">⤢</button></div>
  </div>
  <section id="market" class="tray hidden">
    <div class="tray-title"><span>Ανοιχτές κάρτες</span><span id="deck-info"></span></div>
    <div class="row" id="market-row"></div>
  </section>
  <section id="hand" class="tray hidden">
    <div class="tray-title"><span>Οι κάρτες μου</span><span id="hand-count"></span></div>
    <div class="row" id="hand-row"></div>
  </section>
</div>
<div id="sheet-root"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/map-data.js"></script>
<script src="/js/payments.js"></script>
<script src="/js/board.js"></script>
<script src="/js/panzoom.js"></script>
<script src="/js/common.js"></script>
<script src="/js/play.js"></script>
</body>
</html>
